<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成果视频库 - 公域闪剪视频</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app-static/new/tailwind.generated.css">
    <link rel="stylesheet" href="/app-static/new/vendor/fontawesome/css/all.min.css">
    <style>
        body { background: radial-gradient(circle at 50% 0%, #1a103c 0%, #0d0924 50%, #030712 100%); min-height: 100vh; color: #f3f4f6; }
        .glass-panel { background: rgba(15, 23, 42, .54); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); }
        .glass-heavy { background: rgba(7, 11, 24, .93); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.11); }
        .portrait-frame { aspect-ratio: 9 / 16; }
        .thin-scrollbar::-webkit-scrollbar { width: 6px; }
        .thin-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="toast" class="fixed top-6 right-6 z-[80] translate-x-80 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="glass-heavy px-5 py-4 rounded-xl shadow-2xl border-l-4 border-brand-accent flex items-center gap-3">
            <i id="toast-icon" class="fa-solid fa-circle-info text-brand-accent"></i>
            <div><h4 id="toast-title" class="font-bold text-sm text-white">提示</h4><p id="toast-message" class="text-xs text-gray-400 mt-0.5"></p></div>
        </div>
    </div>

    <div id="video-modal" class="fixed inset-0 z-[70] bg-black/90 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-200 flex items-center justify-center px-4">
        <div class="w-full max-w-lg flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-3"><div><h3 id="modal-title" class="text-sm font-bold text-white"></h3><p id="modal-meta" class="text-[10px] text-gray-400 mt-1"></p></div><button onclick="closePreview()" class="w-9 h-9 rounded-full glass-panel text-gray-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
            <video id="modal-video" controls preload="metadata" class="portrait-frame max-h-[76vh] w-auto max-w-full bg-black rounded-2xl border border-white/10 shadow-2xl"></video>
        </div>
    </div>

    <div id="batch-modal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-200 flex items-center justify-center p-4">
        <section class="glass-heavy w-full max-w-6xl max-h-[90vh] rounded-2xl overflow-hidden flex flex-col">
            <header class="px-5 py-4 border-b border-white/10 flex items-center justify-between gap-4">
                <div class="min-w-0"><h3 id="batch-modal-title" class="text-sm font-bold text-white truncate"></h3><p id="batch-modal-meta" class="text-[10px] text-gray-400 mt-1 truncate"></p></div>
                <div class="flex items-center gap-2"><button id="batch-modal-select" class="px-3 py-2 rounded-lg bg-brand-primary/15 border border-brand-primary/30 text-[10px] text-brand-accent"><i class="fa-solid fa-check-double mr-1"></i>全选本批次</button><button onclick="closeBatch()" class="w-9 h-9 rounded-full bg-slate-900 text-gray-300 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
            </header>
            <div id="batch-modal-grid" class="thin-scrollbar overflow-y-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 p-5"></div>
        </section>
    </div>

    <header class="glass-panel sticky top-0 z-40 border-b border-white/5 px-6 py-4 shadow-xl">
        <div class="max-w-[1680px] mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3"><img src="/app-static/new/logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-xl"><div><h1 class="text-lg font-extrabold bg-gradient-to-r from-white via-indigo-200 to-brand-accent bg-clip-text text-transparent">公域闪剪视频</h1><p class="text-[10px] text-brand-accent font-semibold tracking-widest uppercase">Result Library</p></div></div>
            <nav class="hidden md:flex items-center gap-1"><a href="/app/new" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5"><i class="fa-solid fa-sliders mr-1.5"></i>核心工作台</a><a href="/app/new/gallery" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-primary/10 border border-brand-primary/30 text-white"><i class="fa-solid fa-photo-film mr-1.5 text-brand-accent"></i>成果视频库</a><a href="/app/new/voices" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5"><i class="fa-solid fa-microphone-lines mr-1.5"></i>声音克隆中心</a></nav>
            <div class="flex items-center gap-3"><span class="current-user-name hidden sm:block text-xs text-gray-400">当前账号</span><button onclick="logout()" class="px-3 py-2 rounded-lg bg-slate-900/60 text-[10px] text-red-300 hover:bg-red-500/10"><i class="fa-solid fa-right-from-bracket mr-1"></i>退出</button></div>
        </div>
    </header>

    <main class="max-w-[1680px] mx-auto px-4 py-7">
        <div class="flex flex-col xl:flex-row xl:items-end justify-between gap-5 mb-6">
            <div><h2 class="text-xl font-extrabold text-white"><i class="fa-solid fa-folder-tree text-brand-primary mr-2"></i>成果视频库</h2><p class="text-xs text-gray-400 mt-1">按日期与生成批次读取真实剪映导出结果；视频和原始脚本表格保存在同一批次目录。</p><p id="library-root" class="text-[10px] text-brand-accent font-mono mt-2"></p></div>
            <div class="flex flex-wrap items-center gap-2"><span id="selection-summary" class="text-[10px] text-gray-500">已选 0 个</span><button id="select-all-global" onclick="toggleGlobalSelection()" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-semibold text-gray-200 disabled:opacity-40"><i class="fa-solid fa-check-double mr-1.5"></i><span>全选全部成果</span></button><button id="delete-button" onclick="deleteSelected()" disabled class="px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs font-semibold text-rose-300 hover:bg-rose-500/20 disabled:opacity-40 disabled:hover:bg-rose-500/10"><i class="fa-solid fa-trash-can mr-1.5"></i>删除选中</button><button id="zip-button" onclick="downloadSelected()" disabled class="px-4 py-2 rounded-xl bg-gradient-to-r from-brand-primary to-brand-secondary text-xs font-semibold text-white disabled:opacity-40"><i class="fa-solid fa-file-zipper mr-1.5"></i>打包下载选中</button></div>
        </div>

        <section class="glass-panel rounded-2xl p-4 mb-6 grid sm:grid-cols-2 lg:grid-cols-6 gap-3">
            <label class="lg:col-span-2"><span class="block text-[9px] text-gray-500 mb-1">脚本关键词</span><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i><input id="filter-keyword" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 pl-8 pr-3 text-xs outline-none focus:border-brand-primary" placeholder="项目名、任务ID或脚本内容"></div></label>
            <label><span class="block text-[9px] text-gray-500 mb-1">项目</span><select id="filter-project" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 px-3 text-xs outline-none"><option value="">全部项目</option></select></label>
            <label><span class="block text-[9px] text-gray-500 mb-1">日期</span><select id="filter-date" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 px-3 text-xs outline-none"><option value="">全部日期</option></select></label>
            <label><span class="block text-[9px] text-gray-500 mb-1">批次</span><select id="filter-batch" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 px-3 text-xs outline-none"><option value="">全部批次</option></select></label>
            <label><span class="block text-[9px] text-gray-500 mb-1">状态</span><select id="filter-status" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 px-3 text-xs outline-none"><option value="">全部状态</option><option value="SUCCEEDED">全部成功</option><option value="PARTIAL_FAILED">部分失败</option><option value="FAILED">失败</option><option value="RUNNING">生成中</option></select></label>
        </section>

        <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
        <div id="loading" class="glass-panel rounded-2xl p-12 text-center text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin text-brand-primary mr-2"></i>正在读取成果目录...</div>
        <div id="empty" class="hidden glass-panel rounded-2xl p-14 text-center"><i class="fa-solid fa-folder-open text-3xl text-slate-600"></i><h3 class="mt-3 text-sm font-bold text-white">暂无符合条件的成果</h3><p class="mt-1 text-xs text-gray-500">完成模块 6 的剪映变体导出后，结果会自动出现在这里。</p></div>
        <div id="batch-list" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </main>

    <script>
        let libraryData = null;
        let reloadTimer = null;
        let activeBatch = null;
        const selectedAssetIds = new Set();

        function escapeHtml(value) { const div = document.createElement('div'); div.textContent = String(value ?? ''); return div.innerHTML; }
        function showToast(title, message, type = 'info') { const toast = document.getElementById('toast'); document.getElementById('toast-title').textContent = title; document.getElementById('toast-message').textContent = message; const icon = document.getElementById('toast-icon'); icon.className = `fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'warning' ? 'fa-triangle-exclamation text-amber-400' : 'fa-circle-info text-brand-accent'}`; toast.classList.remove('translate-x-80', 'opacity-0'); setTimeout(() => toast.classList.add('translate-x-80', 'opacity-0'), 3200); }
        async function api(url, options = {}) { const response = await fetch(url, { credentials: 'same-origin', ...options }); if (response.status === 401) { location.replace(`/app/new/login?next=${encodeURIComponent(location.pathname)}`); throw new Error('请先登录'); } if (!response.ok) { let detail = `请求失败 (${response.status})`; try { detail = (await response.json()).detail || detail; } catch (_) {} throw new Error(detail); } return response; }
        function statusLabel(status) { return ({ SUCCEEDED: '全部成功', PARTIAL_FAILED: '部分失败', FAILED: '失败', RUNNING: '生成中', ALLOCATED: '准备中' })[status] || status; }
        function statusClass(status) { return status === 'SUCCEEDED' ? 'text-emerald-300 bg-emerald-500/10 border-emerald-500/20' : status === 'PARTIAL_FAILED' ? 'text-amber-300 bg-amber-500/10 border-amber-500/20' : status === 'FAILED' ? 'text-rose-300 bg-rose-500/10 border-rose-500/20' : 'text-brand-accent bg-brand-primary/10 border-brand-primary/20'; }

        async function ensureSession() { const response = await api('/api/auth/session'); const session = await response.json(); if (!session.authenticated) throw new Error('请先登录'); document.querySelectorAll('.current-user-name').forEach(el => el.textContent = session.username || '已登录用户'); }
        async function logout() { try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } finally { location.replace('/app/new/login'); } }

        function buildQuery() { const params = new URLSearchParams(); [['project_id','filter-project'],['date_key','filter-date'],['status','filter-status'],['keyword','filter-keyword']].forEach(([key,id]) => { const value = document.getElementById(id).value.trim(); if (value) params.set(key, value); }); const batch = document.getElementById('filter-batch').value; if (batch) params.set('batch_no', batch); return params.toString(); }
        function populateFilters(data) { const project = document.getElementById('filter-project'); if (project.options.length === 1) data.projects.forEach(item => project.add(new Option(`${item.project_no} · ${item.project_name}`, item.project_id))); const date = document.getElementById('filter-date'); if (date.options.length === 1) data.available_dates.forEach(item => date.add(new Option(item[1], item[0]))); const batch = document.getElementById('filter-batch'); if (batch.options.length === 1) data.available_batches.forEach(value => batch.add(new Option(`第 ${value} 批`, value))); }

        function availableVideos(batch = null) { const batches = batch ? [batch] : (libraryData?.batches || []); return batches.flatMap(item => item.videos || []).filter(video => video.available); }
        async function loadGallery() { clearTimeout(reloadTimer); document.getElementById('loading').classList.remove('hidden'); try { const response = await api(`/api/new/gallery?${buildQuery()}`); libraryData = await response.json(); const visibleIds = new Set(availableVideos().map(video => video.asset_id)); Array.from(selectedAssetIds).forEach(id => { if (!visibleIds.has(id)) selectedAssetIds.delete(id); }); populateFilters(libraryData); renderGallery(); if (libraryData.batches.some(batch => ['RUNNING','ALLOCATED'].includes(batch.status))) reloadTimer = setTimeout(loadGallery, 5000); } catch (error) { showToast('成果库加载失败', error.message, 'warning'); } finally { document.getElementById('loading').classList.add('hidden'); } }
        function renderSummary(data) { const success = data.batches.filter(batch => batch.status === 'SUCCEEDED').length; const partial = data.batches.filter(batch => batch.status === 'PARTIAL_FAILED').length; document.getElementById('summary').innerHTML = [[data.total_batches,'成果批次'],[data.total_videos,'成果视频'],[success,'全部成功'],[partial,'部分失败']].map(([value,label]) => `<div class="glass-panel rounded-xl px-4 py-3"><strong class="block text-xl text-white">${value}</strong><span class="text-[10px] text-gray-500">${label}</span></div>`).join(''); }
        function renderGallery() { const data = libraryData; document.getElementById('library-root').textContent = `导出根目录：${data.root}`; renderSummary(data); const list = document.getElementById('batch-list'); list.innerHTML = ''; document.getElementById('empty').classList.toggle('hidden', data.batches.length > 0); data.batches.forEach(batch => list.appendChild(renderBatchOverview(batch))); updateSelection(); }
        function renderBatchOverview(batch) { const card = document.createElement('article'); card.className = 'glass-panel rounded-2xl overflow-hidden cursor-pointer hover:border-brand-primary/40 transition-colors'; const thumbs = (batch.videos || []).slice(0, 4).map(video => video.available ? `<div class="portrait-frame min-w-0 bg-black rounded-lg overflow-hidden"><video muted preload="metadata" class="w-full h-full object-cover" src="${escapeHtml(video.url)}"></video></div>` : '<div class="portrait-frame rounded-lg bg-slate-950 flex items-center justify-center text-slate-700"><i class="fa-solid fa-video-slash"></i></div>').join(''); card.innerHTML = `<div class="p-4"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="flex items-center gap-2"><h3 class="font-bold text-white">${escapeHtml(batch.date_label)} / 第 ${batch.batch_no || '-'} 批</h3><span class="px-2 py-0.5 rounded border text-[9px] ${statusClass(batch.status)}">${statusLabel(batch.status)}</span></div><p class="text-[10px] text-gray-400 mt-1 truncate">${escapeHtml(batch.project_no)} · ${escapeHtml(batch.project_name)}</p></div><span class="text-[10px] text-gray-500 whitespace-nowrap">${batch.available_count}/${batch.video_count}</span></div><div class="grid grid-cols-4 gap-2 h-36 overflow-hidden mt-4">${thumbs || '<div class="col-span-4 flex items-center justify-center text-xs text-gray-600">尚无视频</div>'}</div><p class="text-[9px] text-brand-accent/70 font-mono mt-3 truncate">${escapeHtml(batch.export_path)}</p></div><footer class="px-4 py-3 border-t border-white/5 flex items-center justify-between gap-2"><button class="batch-select-button px-3 py-1.5 rounded-lg bg-brand-primary/10 border border-brand-primary/25 text-[10px] text-brand-accent" data-batch-id="${escapeHtml(batch.result_batch_id)}"><i class="fa-solid fa-check-double mr-1"></i><span>全选本批次</span></button><span class="text-[10px] text-gray-400">点击查看本批次效果 <i class="fa-solid fa-chevron-right ml-1"></i></span></footer>`; card.onclick = () => openBatch(batch); const selectButton = card.querySelector('.batch-select-button'); selectButton.onclick = event => { event.stopPropagation(); toggleBatchSelection(batch); }; return card; }
        function renderVideoCard(video, index) { const card = document.createElement('article'); card.className = 'rounded-xl overflow-hidden bg-slate-950/60 border border-slate-800 hover:border-brand-primary/50 transition-colors'; card.innerHTML = `<div class="relative portrait-frame bg-black"><video muted preload="metadata" class="w-full h-full object-contain" src="${escapeHtml(video.url)}"></video><button class="absolute inset-0 bg-black/15 hover:bg-black/40 flex items-center justify-center transition-colors" aria-label="预览"><span class="w-9 h-9 rounded-full bg-brand-primary/90 flex items-center justify-center"><i class="fa-solid fa-play text-xs"></i></span></button><label class="absolute left-2 top-2 w-6 h-6 rounded bg-black/75 flex items-center justify-center" onclick="event.stopPropagation()"><input type="checkbox" class="gallery-check accent-indigo-500" data-asset-id="${escapeHtml(video.asset_id)}" ${selectedAssetIds.has(video.asset_id) ? 'checked' : ''} ${video.available ? '' : 'disabled'}></label>${video.available ? '' : '<span class="absolute bottom-2 left-2 px-2 py-1 rounded bg-rose-500/90 text-[9px]">文件缺失</span>'}</div><div class="p-2.5"><strong class="block text-[10px] text-white truncate">任务 ${escapeHtml(video.row_key)} · 变体 ${String(index + 1).padStart(2,'0')}</strong><p class="text-[9px] text-gray-400 mt-1 line-clamp-2 min-h-[28px]">${escapeHtml(video.script_text)}</p><div class="mt-2 flex justify-between items-center"><span class="text-[9px] text-gray-500">${escapeHtml(video.metadata?.dimensions?.crop_ratio || '')}</span><a href="${escapeHtml(video.url)}" download class="text-[10px] text-brand-accent hover:text-white"><i class="fa-solid fa-download mr-1"></i>下载</a></div></div>`; card.querySelector('button').onclick = () => openPreview(video); const checkbox = card.querySelector('.gallery-check'); checkbox.onchange = () => { if (checkbox.checked) selectedAssetIds.add(video.asset_id); else selectedAssetIds.delete(video.asset_id); updateSelection(); }; return card; }
        function openBatch(batch) { activeBatch = batch; document.getElementById('batch-modal-title').textContent = `${batch.date_label} / 第 ${batch.batch_no || '-'} 批 · ${batch.project_name}`; document.getElementById('batch-modal-meta').textContent = `${batch.available_count}/${batch.video_count} 个文件可用 · ${batch.export_path}`; const grid = document.getElementById('batch-modal-grid'); grid.innerHTML = ''; (batch.videos || []).forEach((video, index) => grid.appendChild(renderVideoCard(video, index))); if (!batch.videos?.length) grid.innerHTML = '<p class="col-span-full py-12 text-center text-xs text-gray-500">该批次尚无可展示的视频</p>'; document.getElementById('batch-modal-select').onclick = () => toggleBatchSelection(batch); document.getElementById('batch-modal').classList.remove('opacity-0','pointer-events-none'); updateSelection(); }
        function closeBatch() { activeBatch = null; document.getElementById('batch-modal').classList.add('opacity-0','pointer-events-none'); }
        function openPreview(video) { document.getElementById('modal-title').textContent = `${video.project_no} · 任务 ${video.row_key}`; document.getElementById('modal-meta').textContent = video.script_text; const player = document.getElementById('modal-video'); player.src = video.url; const modal = document.getElementById('video-modal'); modal.classList.remove('opacity-0','pointer-events-none'); }
        function closePreview() { const modal = document.getElementById('video-modal'); const player = document.getElementById('modal-video'); player.pause(); player.removeAttribute('src'); player.load(); modal.classList.add('opacity-0','pointer-events-none'); }
        function toggleGlobalSelection() { const videos = availableVideos(); const allSelected = videos.length > 0 && videos.every(video => selectedAssetIds.has(video.asset_id)); videos.forEach(video => allSelected ? selectedAssetIds.delete(video.asset_id) : selectedAssetIds.add(video.asset_id)); updateSelection(); }
        function toggleBatchSelection(batch) { const videos = availableVideos(batch); const allSelected = videos.length > 0 && videos.every(video => selectedAssetIds.has(video.asset_id)); videos.forEach(video => allSelected ? selectedAssetIds.delete(video.asset_id) : selectedAssetIds.add(video.asset_id)); updateSelection(); }
        function updateSelection() { const currentIds = new Set(availableVideos().map(video => video.asset_id)); const selected = Array.from(selectedAssetIds).filter(id => currentIds.has(id)); document.getElementById('selection-summary').textContent = `已选 ${selected.length} 个`; document.getElementById('zip-button').disabled = selected.length === 0; document.getElementById('delete-button').disabled = selected.length === 0; const allVideos = availableVideos(); const globalAll = allVideos.length > 0 && allVideos.every(video => selectedAssetIds.has(video.asset_id)); const globalButton = document.getElementById('select-all-global'); globalButton.disabled = allVideos.length === 0; globalButton.querySelector('span').textContent = globalAll ? '取消全部选择' : '全选全部成果'; document.querySelectorAll('.gallery-check').forEach(input => { input.checked = selectedAssetIds.has(input.dataset.assetId); }); (libraryData?.batches || []).forEach(batch => { const videos = availableVideos(batch); const all = videos.length > 0 && videos.every(video => selectedAssetIds.has(video.asset_id)); document.querySelectorAll(`[data-batch-id="${CSS.escape(String(batch.result_batch_id))}"] span`).forEach(span => span.textContent = all ? '取消本批次' : '全选本批次'); }); if (activeBatch) { const videos = availableVideos(activeBatch); const all = videos.length > 0 && videos.every(video => selectedAssetIds.has(video.asset_id)); document.getElementById('batch-modal-select').innerHTML = `<i class="fa-solid fa-check-double mr-1"></i>${all ? '取消本批次' : '全选本批次'}`; } }
        async function downloadSelected() { const visible = new Set(availableVideos().map(video => video.asset_id)); const assetIds = Array.from(selectedAssetIds).filter(id => visible.has(id)); if (!assetIds.length) return; try { const response = await api('/api/new/gallery/downloads', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({asset_ids: assetIds}) }); const blob = await response.blob(); const url = URL.createObjectURL(blob); const anchor = document.createElement('a'); anchor.href = url; anchor.download = '成果视频.zip'; anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); showToast('打包完成', `已下载 ${assetIds.length} 个成果视频。`, 'success'); } catch (error) { showToast('打包下载失败', error.message, 'warning'); } }
        async function deleteSelected() { const visible = new Set(availableVideos().map(video => video.asset_id)); const assetIds = Array.from(selectedAssetIds).filter(id => visible.has(id)); if (!assetIds.length) return; if (!window.confirm(`确定永久删除选中的 ${assetIds.length} 个成果视频吗？此操作会同时删除导出文件，且无法撤销。`)) return; const button = document.getElementById('delete-button'); button.disabled = true; try { const response = await api('/api/new/gallery/deletions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({asset_ids: assetIds}) }); const result = await response.json(); assetIds.forEach(id => selectedAssetIds.delete(id)); closeBatch(); await loadGallery(); showToast('删除完成', `已删除 ${result.deleted_count} 个成果视频。`, 'success'); } catch (error) { showToast('删除失败', error.message, 'warning'); updateSelection(); } }

        ['filter-project','filter-date','filter-batch','filter-status'].forEach(id => document.getElementById(id).addEventListener('change', loadGallery)); let keywordTimer; document.getElementById('filter-keyword').addEventListener('input', () => { clearTimeout(keywordTimer); keywordTimer = setTimeout(loadGallery, 300); });
        document.addEventListener('DOMContentLoaded', async () => { try { await ensureSession(); await loadGallery(); } catch (_) {} });
    </script>
</body>
</html>
