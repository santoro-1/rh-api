<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪映模板中心 - 公域闪剪视频</title>
    <link rel="stylesheet" href="/app-static/new/tailwind.generated.css">
    <link rel="stylesheet" href="/app-static/new/vendor/fontawesome/css/all.min.css">
    <script src="/app-static/workbench-runtime.js" defer></script>
    <style>
        body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; background: #020617; color: #e2e8f0; min-height: 100vh; }
        body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 12% 0%, rgba(99,102,241,.16), transparent 34%), radial-gradient(circle at 88% 12%, rgba(6,182,212,.1), transparent 30%); }
        .glass-panel { background: rgba(15,23,42,.76); border: 1px solid rgba(148,163,184,.12); backdrop-filter: blur(18px); }
        .template-cover { aspect-ratio: 16 / 9; background: linear-gradient(135deg, rgba(30,41,59,.95), rgba(15,23,42,.98)); }
        .modal-hidden { opacity: 0; pointer-events: none; }
        button:disabled { opacity: .45; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="toast" class="fixed right-5 top-5 z-[80] w-80 translate-x-96 opacity-0 transition-all duration-300 glass-panel rounded-xl p-4 shadow-2xl">
        <div class="flex gap-3"><i id="toast-icon" class="fa-solid fa-circle-info text-brand-accent mt-0.5"></i><div><strong id="toast-title" class="block text-xs text-white"></strong><p id="toast-message" class="mt-1 text-[10px] leading-5 text-gray-400"></p></div></div>
    </div>

    <header class="glass-panel sticky top-0 z-40 border-b border-white/5 px-6 py-4 shadow-xl">
        <div class="max-w-[1680px] mx-auto flex items-center justify-between gap-5">
            <div class="flex items-center gap-3"><img src="/app-static/new/logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-xl"><div><h1 class="text-lg font-extrabold bg-gradient-to-r from-white via-indigo-200 to-brand-accent bg-clip-text text-transparent">公域闪剪视频</h1><p class="text-[10px] text-brand-accent font-semibold tracking-widest uppercase">Template Center</p></div></div>
            <nav class="hidden md:flex items-center gap-1">
                <a href="/app/new" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5"><i class="fa-solid fa-sliders mr-1.5"></i>核心工作台</a>
                <a href="/app/new/templates" class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-primary/10 border border-brand-primary/30 text-white"><i class="fa-solid fa-clapperboard mr-1.5 text-brand-accent"></i>剪映模板中心</a>
                <a href="/app/new/gallery" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5"><i class="fa-solid fa-photo-film mr-1.5"></i>成果视频库</a>
                <a href="/app/new/voices" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-300 hover:text-white hover:bg-white/5"><i class="fa-solid fa-microphone-lines mr-1.5"></i>声音克隆中心</a>
            </nav>
            <div class="flex items-center gap-3"><span class="current-user-name hidden sm:block text-xs text-gray-400">当前账号</span><button onclick="logout()" class="px-3 py-2 rounded-lg bg-slate-900/60 text-[10px] text-red-300 hover:bg-red-500/10"><i class="fa-solid fa-right-from-bracket mr-1"></i>退出</button></div>
        </div>
    </header>

    <main class="relative max-w-[1680px] mx-auto px-4 py-7">
        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-5 mb-6">
            <div><h2 class="text-xl font-extrabold text-white"><i class="fa-solid fa-clapperboard text-brand-primary mr-2"></i>我的剪映模板</h2><p class="text-xs text-gray-400 mt-1">模板保存在当前部署机，并按登录账号隔离；无视频轨的纯样式草稿也可以保存。</p></div>
            <div class="flex flex-wrap gap-2"><button onclick="openCollectorImport()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-primary to-brand-secondary text-xs font-bold text-white shadow-lg"><i class="fa-solid fa-computer mr-2"></i>从本机剪映导入</button><button onclick="openUpload()" class="px-4 py-2.5 rounded-xl bg-slate-900/70 border border-slate-700 text-xs text-gray-300"><i class="fa-solid fa-folder-plus mr-2"></i>浏览器上传（备用）</button></div>
        </div>

        <section class="glass-panel rounded-2xl p-4 mb-6 grid sm:grid-cols-3 gap-3">
            <label class="sm:col-span-2"><span class="block text-[9px] text-gray-500 mb-1">模板名称</span><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i><input id="filter-keyword" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 pl-8 pr-3 text-xs outline-none focus:border-brand-primary" placeholder="搜索当前账号的模板"></div></label>
            <label><span class="block text-[9px] text-gray-500 mb-1">状态</span><select id="filter-status" class="w-full bg-slate-950/70 border border-slate-800 rounded-lg py-2 px-3 text-xs outline-none"><option value="">全部状态</option><option value="READY">可使用</option><option value="NEEDS_RESOURCES">待补资源</option><option value="UPLOADING">上传中</option></select></label>
        </section>

        <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
        <div id="loading" class="glass-panel rounded-2xl p-12 text-center text-sm text-gray-400"><i class="fa-solid fa-spinner fa-spin text-brand-primary mr-2"></i>正在读取当前账号模板...</div>
        <div id="empty" class="hidden glass-panel rounded-2xl p-14 text-center"><i class="fa-solid fa-clapperboard text-3xl text-slate-600"></i><h3 class="mt-3 text-sm font-bold text-white">当前账号还没有模板</h3><p class="mt-1 text-xs text-gray-500">上传具体剪映草稿目录后，模板会长期保存在这台部署机。</p></div>
        <div id="template-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4"></div>
    </main>

    <div id="upload-modal" class="modal-hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/75 backdrop-blur-sm transition-all px-4">
        <div class="glass-panel w-full max-w-xl rounded-2xl p-6 shadow-2xl">
            <div class="flex items-start justify-between gap-4"><div><h3 class="font-bold text-white">上传剪映模板</h3><p class="mt-1 text-[10px] text-gray-400">选择只包含一个 draft_content.json 的具体草稿文件夹。</p></div><button onclick="closeUpload()" class="w-8 h-8 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
            <label class="block mt-5"><span class="block text-[10px] text-gray-400 mb-1.5">模板名称</span><input id="upload-name" maxlength="80" class="w-full bg-slate-950/70 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-brand-primary" placeholder="例如：健康口播花字模板"></label>
            <p id="upload-progress" class="min-h-[20px] mt-3 text-[10px] text-gray-500"></p>
            <div class="mt-5 flex justify-end gap-3"><button onclick="closeUpload()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-gray-300">取消</button><button id="upload-button" onclick="uploadTemplate()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-primary to-brand-secondary text-xs font-bold text-white"><i class="fa-solid fa-folder-open mr-2"></i>选择草稿并上传</button></div>
        </div>
    </div>

    <div id="collector-import-modal" class="modal-hidden fixed inset-0 z-[65] flex items-center justify-center bg-black/75 backdrop-blur-sm transition-all px-4">
        <div class="glass-panel w-full max-w-2xl rounded-2xl p-6 shadow-2xl">
            <div class="flex items-start justify-between gap-4"><div><h3 class="font-bold text-white">从本机剪映导入模板</h3><p class="mt-1 text-[10px] leading-5 text-gray-400">采集器会自动定位草稿及关联资源；主视频、旧语音和 BGM 不上传，花字、贴纸、字体和特效随模板保存。</p></div><button onclick="closeCollectorImport()" class="w-8 h-8 rounded-lg text-gray-400 hover:bg-white/5 hover:text-white"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="grid sm:grid-cols-[1fr_auto] gap-3 mt-5"><label><span class="block text-[9px] text-gray-500 mb-1">本机采集器地址</span><input id="collector-import-url" class="w-full bg-slate-950/70 border border-slate-700 rounded-xl px-3 py-2 text-xs outline-none focus:border-brand-primary" value="http://127.0.0.1:8765"></label><button id="collector-refresh-button" class="self-end px-4 py-2 rounded-xl bg-slate-800 text-xs text-gray-200"><i class="fa-solid fa-rotate mr-1"></i>扫描草稿</button></div>
            <label class="block mt-3"><span class="block text-[9px] text-gray-500 mb-1">选择草稿</span><select id="collector-draft-select" class="w-full bg-slate-950/70 border border-slate-700 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-brand-primary"><option value="">正在连接本机采集器...</option></select></label>
            <label class="block mt-3"><span class="block text-[9px] text-gray-500 mb-1">保存到当前账号的模板名称</span><input id="collector-template-name" maxlength="80" class="w-full bg-slate-950/70 border border-slate-700 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-brand-primary" placeholder="例如：健康口播花字模板"></label>
            <p id="collector-import-progress" class="min-h-[38px] mt-3 rounded-xl bg-slate-950/55 px-3 py-2 text-[10px] leading-5 text-gray-400">请先启动本机剪映采集器。</p>
            <div class="mt-5 flex justify-end gap-3"><button onclick="closeCollectorImport()" class="px-4 py-2 rounded-xl bg-slate-800 text-xs text-gray-300">取消</button><button id="collector-import-button" disabled class="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-primary to-brand-secondary text-xs font-bold text-white"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>分析并保存模板</button></div>
        </div>
    </div>

    <script>
        const DRAFT_FILES = new Set(['draft_content.json', 'draft_meta_info.json', 'draft_agency_config.json', 'draft_cover.jpg', 'draft_cover.png']);
        const RESOURCE_EXTENSIONS = new Set(['json','png','jpg','jpeg','webp','gif','svg','ttf','otf','woff','woff2','mp4','mov','webm','bin','dat']);
        const state = { templates: [], busy: false };
        const node = id => document.getElementById(id);
        const escapeHtml = value => { const div = document.createElement('div'); div.textContent = String(value ?? ''); return div.innerHTML; };

        function showToast(title, message, type = 'info') { node('toast-title').textContent = title; node('toast-message').textContent = message; node('toast-icon').className = `fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : type === 'warning' ? 'fa-triangle-exclamation text-amber-400' : 'fa-circle-info text-brand-accent'} mt-0.5`; node('toast').classList.remove('translate-x-96','opacity-0'); setTimeout(() => node('toast').classList.add('translate-x-96','opacity-0'), 3300); }
        async function api(path, options = {}) { const response = await fetch(path, { credentials: 'same-origin', ...options }); if (response.status === 401) { location.replace(`/app/new/login?next=${encodeURIComponent(location.pathname)}`); throw new Error('请先登录'); } if (!response.ok) { let detail = `请求失败 (${response.status})`; try { detail = (await response.json()).detail || detail; } catch (_) {} throw new Error(detail); } const type = response.headers.get('content-type') || ''; return type.includes('application/json') ? response.json() : response; }
        async function ensureSession() { const session = await api('/api/auth/session'); if (!session.authenticated) throw new Error('请先登录'); document.querySelectorAll('.current-user-name').forEach(el => el.textContent = session.username || '已登录用户'); }
        async function logout() { try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } finally { location.replace('/app/new/login'); } }
        function openUpload() { node('upload-modal').classList.remove('modal-hidden'); node('upload-name').focus(); }
        function closeUpload() { if (!state.busy) node('upload-modal').classList.add('modal-hidden'); }
        function progress(message, warning = false) { node('upload-progress').textContent = message || ''; node('upload-progress').className = `min-h-[20px] mt-3 text-[10px] ${warning ? 'text-rose-300' : 'text-gray-500'}`; }
        function durationLabel(value) { const seconds = Math.max(0, Number(value || 0) / 1_000_000); return seconds ? `${seconds.toFixed(seconds >= 10 ? 0 : 1)} 秒` : '未识别'; }
        const RESOURCE_KIND_LABELS = { font: '字体资源', text_effect: '花字资源', text_template_resource: '文字模板资源', sticker: '贴纸资源', video_effect: '特效资源', image: '图片资源' };
        function missingResourceLabel(item) { const missing = item.missing_resources || []; const labels = new Set(missing.map(resource => RESOURCE_KIND_LABELS[resource.kind] || '关联资源')); return labels.size === 1 ? `缺少 ${missing.length} 个${Array.from(labels)[0]}` : `缺少 ${missing.length} 个模板资源`; }
        function statusLabel(item) { if (item.status === 'READY') return ['可使用', 'text-emerald-300 bg-emerald-500/10 border-emerald-500/20']; if (item.status === 'NEEDS_RESOURCES') return [missingResourceLabel(item), 'text-amber-300 bg-amber-500/10 border-amber-500/20']; return ['未完成', 'text-gray-300 bg-slate-700/30 border-slate-600/30']; }

        function visibleTemplates() { const keyword = node('filter-keyword').value.trim().toLowerCase(); const status = node('filter-status').value; return state.templates.filter(item => (!keyword || String(item.name || '').toLowerCase().includes(keyword)) && (!status || item.status === status)); }
        function render() { const visible = visibleTemplates(); const ready = state.templates.filter(item => item.status === 'READY').length; const repair = state.templates.filter(item => item.status === 'NEEDS_RESOURCES').length; const withoutVideo = state.templates.filter(item => !item.profile?.main_video).length; node('summary').innerHTML = [[state.templates.length,'全部模板'],[ready,'可使用'],[repair,'待补资源'],[withoutVideo,'无视频轨模板']].map(([value,label]) => `<div class="glass-panel rounded-xl px-4 py-3"><strong class="block text-xl text-white">${value}</strong><span class="text-[10px] text-gray-500">${label}</span></div>`).join(''); node('empty').classList.toggle('hidden', state.templates.length > 0); const grid = node('template-grid'); grid.innerHTML = ''; visible.forEach(item => grid.appendChild(templateCard(item))); if (state.templates.length && !visible.length) grid.innerHTML = '<p class="col-span-full py-12 text-center text-xs text-gray-500">没有符合筛选条件的模板。</p>'; }
        function templateCard(item) { const [label, badge] = statusLabel(item); const article = document.createElement('article'); article.className = 'glass-panel rounded-2xl overflow-hidden'; const cover = item.has_cover ? `<img src="/api/new/jianying-templates/${encodeURIComponent(item.template_id)}/cover?v=${encodeURIComponent(item.updated_at || '')}" class="w-full h-full object-cover" alt="${escapeHtml(item.name)}封面">` : '<div class="w-full h-full flex flex-col items-center justify-center text-slate-600"><i class="fa-solid fa-clapperboard text-3xl"></i><span class="mt-2 text-[10px]">暂无草稿封面</span></div>'; const captionCount = Number(item.profile?.caption_track?.segment_count || 0); const canUse = item.status === 'READY'; article.innerHTML = `<div class="template-cover">${cover}</div><div class="p-4"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="font-bold text-sm text-white truncate">${escapeHtml(item.name)}</h3><p class="mt-1 text-[9px] text-gray-500">更新于 ${escapeHtml(String(item.updated_at || '').replace('T',' ').slice(0,16))}</p></div><span class="shrink-0 px-2 py-1 rounded-lg border text-[9px] ${badge}">${label}</span></div><div class="grid grid-cols-3 gap-2 mt-4 text-center"><div class="rounded-lg bg-slate-950/55 py-2"><strong class="block text-[11px] text-white">${durationLabel(item.profile?.draft_duration_us)}</strong><span class="text-[8px] text-gray-500">草稿时长</span></div><div class="rounded-lg bg-slate-950/55 py-2"><strong class="block text-[11px] text-white">${captionCount}</strong><span class="text-[8px] text-gray-500">字幕片段</span></div><div class="rounded-lg bg-slate-950/55 py-2"><strong class="block text-[11px] ${item.profile?.main_video ? 'text-brand-accent' : 'text-emerald-300'}">${item.profile?.main_video ? '占位替换' : '自动新建'}</strong><span class="text-[8px] text-gray-500">主视频轨</span></div></div></div><footer class="border-t border-white/5 px-3 py-3 flex flex-wrap gap-2"><button data-action="workspace" ${canUse ? '' : 'disabled'} class="flex-1 min-w-24 px-3 py-2 rounded-lg bg-brand-primary/10 border border-brand-primary/25 text-[10px] text-brand-accent"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>去工作台使用</button>${item.status === 'NEEDS_RESOURCES' ? '<button data-action="repair" class="px-3 py-2 rounded-lg bg-amber-500/10 text-[10px] text-amber-200" title="补充资源"><i class="fa-solid fa-screwdriver-wrench"></i></button>' : ''}<button data-action="rename" class="px-3 py-2 rounded-lg bg-slate-900 text-[10px] text-gray-300" title="重命名"><i class="fa-solid fa-pen"></i></button><button data-action="delete" class="px-3 py-2 rounded-lg bg-rose-500/10 text-[10px] text-rose-300" title="删除"><i class="fa-solid fa-trash"></i></button></footer>`; article.querySelectorAll('[data-action]').forEach(button => button.onclick = () => runAction(button.dataset.action, item)); return article; }
        async function loadTemplates() { node('loading').classList.remove('hidden'); try { state.templates = (await api('/api/new/jianying-templates')).templates || []; render(); } catch (error) { showToast('模板加载失败', error.message, 'warning'); } finally { node('loading').classList.add('hidden'); } }

        function relativeBrowserPath(file) { const parts = String(file.webkitRelativePath || file.name || '').replaceAll('\\','/').split('/').filter(Boolean); return parts.length > 1 ? parts.slice(1).join('/') : (parts[0] || file.name || 'file'); }
        function legacyDirectory() { return new Promise(resolve => { const input = document.createElement('input'); input.type = 'file'; input.multiple = true; input.setAttribute('webkitdirectory',''); input.style.display = 'none'; const finish = () => { const files = Array.from(input.files || []).map(file => ({ path: relativeBrowserPath(file), file })); input.remove(); resolve(files); }; input.addEventListener('change', finish, { once: true }); input.addEventListener('cancel', finish, { once: true }); document.body.appendChild(input); input.click(); }); }
        async function selectedDraftFiles() { let entries = []; if (window.isSecureContext && typeof window.showDirectoryPicker === 'function') { const handle = await window.showDirectoryPicker({ mode: 'read' }); for await (const [name, child] of handle.entries()) if (child.kind === 'file' && DRAFT_FILES.has(name.toLowerCase())) entries.push({ path: name, file: await child.getFile() }); } else { entries = (await legacyDirectory()).filter(entry => !entry.path.includes('/') && DRAFT_FILES.has(entry.path.toLowerCase())); } if (!entries.some(entry => entry.path.toLowerCase() === 'draft_content.json')) throw new Error('所选目录没有 draft_content.json，请选择具体剪映草稿文件夹。'); return entries; }
        async function uploadFiles(templateId, endpoint, files, extra = {}) { for (let i = 0; i < files.length; i += 1) { const entry = files[i]; progress(`正在上传 ${i + 1} / ${files.length}：${entry.path}`); const query = new URLSearchParams({ ...extra, path: entry.path }); await api(`/api/new/jianying-templates/${templateId}/${endpoint}?${query}`, { method: 'PUT', headers: {'Content-Type':'application/octet-stream'}, body: entry.file }); } }
        async function uploadTemplate() { if (state.busy) return; const name = node('upload-name').value.trim(); if (!name) { progress('请先填写模板名称。', true); return; } let created = null; try { const files = await selectedDraftFiles(); state.busy = true; node('upload-button').disabled = true; created = await api('/api/new/jianying-templates', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) }); await uploadFiles(created.template_id, 'draft-files', files); progress('正在识别字幕轨、模板资源和可选视频占位轨...'); const analyzed = await api(`/api/new/jianying-templates/${created.template_id}/analyze`, { method: 'POST' }); node('upload-name').value = ''; await loadTemplates(); node('upload-modal').classList.add('modal-hidden'); showToast('模板已保存', analyzed.status === 'READY' ? '现在可以在任意项目中重复使用。' : '模板已保存，还需要补充缺失资源。', analyzed.status === 'READY' ? 'success' : 'warning'); } catch (error) { if (created) try { await api(`/api/new/jianying-templates/${created.template_id}`, { method: 'DELETE' }); } catch (_) {} progress(error.message, true); } finally { state.busy = false; node('upload-button').disabled = false; } }

        async function directoryAt(root, relative) { let current = root; for (const part of String(relative || '').replaceAll('\\','/').split('/').filter(Boolean)) current = await current.getDirectoryHandle(part); return current; }
        async function resourceFiles(handle, prefix = '', output = []) { for await (const [name, child] of handle.entries()) { if (output.length >= 500) throw new Error('单个资源超过 500 个文件。'); const path = prefix ? `${prefix}/${name}` : name; if (child.kind === 'directory') await resourceFiles(child, path, output); else { const extension = name.includes('.') ? name.split('.').pop().toLowerCase() : 'dat'; if (RESOURCE_EXTENSIONS.has(extension)) output.push({ path, file: await child.getFile() }); } } return output; }
        async function repair(item) { if (!item.missing_resources?.length) return; let cacheRoot = null; if (window.isSecureContext && typeof window.showDirectoryPicker === 'function') cacheRoot = await window.showDirectoryPicker({ mode: 'read' }); for (const missing of item.missing_resources) { let files = []; if (cacheRoot) { let resource = null; for (const candidate of missing.candidate_cache_paths || []) { try { resource = await directoryAt(cacheRoot, candidate); break; } catch (_) {} } if (!resource) throw new Error('所选 Cache 目录中没有找到缺失资源。'); files = await resourceFiles(resource); } else { showToast('请选择资源目录', missing.candidate_cache_paths?.[0] || '请选择提示的剪映缓存资源目录'); files = (await legacyDirectory()).filter(entry => RESOURCE_EXTENSIONS.has(entry.path.includes('.') ? entry.path.split('.').pop().toLowerCase() : 'dat')).slice(0,500); } if (!files.length) throw new Error('所选目录中没有可上传的资源文件。'); await uploadFiles(item.template_id, 'resource-files', files, { resource_key: missing.resource_key }); } await api(`/api/new/jianying-templates/${item.template_id}/resources/complete`, { method: 'POST' }); await loadTemplates(); showToast('资源修复完成', '模板状态已经更新。', 'success'); }
        async function runAction(action, item) { try { if (action === 'workspace') { localStorage.setItem('jyd-pending-template-id', item.template_id); location.href = '/app/new'; return; } if (action === 'repair') return await repair(item); if (action === 'rename') { const name = prompt('新的模板名称', item.name || ''); if (!name?.trim()) return; await api(`/api/new/jianying-templates/${item.template_id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) }); } if (action === 'delete') { if (!confirm(`确认删除“${item.name}”吗？模板草稿和资源副本会一起删除。`)) return; await api(`/api/new/jianying-templates/${item.template_id}`, { method: 'DELETE' }); } await loadTemplates(); showToast('操作已保存', '模板中心已经刷新。', 'success'); } catch (error) { showToast('操作失败', error.message, 'warning'); } }

        node('filter-keyword').addEventListener('input', render); node('filter-status').addEventListener('change', render);
        document.addEventListener('DOMContentLoaded', async () => { try { await ensureSession(); await loadTemplates(); } catch (_) {} });
    </script>
    <script src="/app-static/new/template-collector.js"></script>
</body>
